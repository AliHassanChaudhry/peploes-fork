name: Dependency audit

on:
  pull_request:
  push:
    branches: [dev, main]
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency audit (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            directory: .
          - name: studio
            directory: studio
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Audit all locked dependencies
        id: audit
        working-directory: ${{ matrix.directory }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/audit-dependencies.sh"

      - name: Upload full audit report
        if: ${{ !cancelled() && steps.audit.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-audit-${{ matrix.name }}
          path: ${{ runner.temp }}/bun-audit.json
          if-no-files-found: error
          retention-days: 14
