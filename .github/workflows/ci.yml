name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  NEXT_PUBLIC_API_BASE_URL: http://localhost:3000
  NODE_ENV: test
  SANITY_PROJECT_ID: testproject
  SANITY_DATASET: development
  SANITY_API_VERSION: '2026-10-06'

jobs:
  performance-tooling:
    name: Performance tooling
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up audit Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install locked dependencies
        run: bun ci

      - name: Check audit tooling and failure policies
        run: |
          test "$(node --version)" = v22.23.4
          node node_modules/@lhci/cli/src/cli.js --version
          bun run test performance

      - name: Reject an unavailable production server
        run: |
          if bun run perf --origin http://127.0.0.1:3119 --phase diagnostic --evidence "$RUNNER_TEMP/performance-unavailable" --manifest performance/manifest.json; then
            echo "Performance command incorrectly accepted an unavailable server" >&2
            exit 1
          fi
          node -e 'const fs = require("node:fs"); const result = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/performance-unavailable/failure.json", "utf8")); if (!/connect|fetch/i.test(result.message)) throw new Error("Unexpected command failure: " + result.message);'

      - name: Retain tooling failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-tooling-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/performance-unavailable
          if-no-files-found: error
          retention-days: 14

  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install locked dependencies
        run: bun ci

      - name: Install locked Studio dependencies
        run: bun install --cwd studio --frozen-lockfile

      - name: Check formatting and lint
        run: bun run lint

      - name: Check types
        run: bun run type-check

      - name: Run tests
        run: bun run test

      - name: Apply database migrations
        run: bun run db:migrate

      - name: Run database integration test
        run: bun run test:integration

      - name: Install Chromium for browser tests
        run: bunx playwright install --with-deps chromium

      - name: Build and browser-test production application
        run: bun run test:e2e
        env:
          NODE_ENV: production

      - name: Build and browser-test reporting and SEO
        run: bun run test:e2e:reporting
        env:
          NODE_ENV: production

      - name: Browser-test transactional enquiry delivery with intercepted providers
        run: bun run test:e2e:email
        env:
          NODE_ENV: production

      - name: Build production Studio
        run: bun run --cwd studio build

      - name: Audit Studio high-severity vulnerabilities
        run: bun run --cwd studio audit

      - name: Audit high-severity vulnerabilities
        run: bun audit --audit-level high
