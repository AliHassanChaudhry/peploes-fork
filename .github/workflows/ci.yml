name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  NEXT_PUBLIC_API_BASE_URL: http://localhost:3000
  NODE_ENV: test
  SANITY_PROJECT_ID: testproject
  SANITY_DATASET: development
  SANITY_API_VERSION: '2026-10-06'

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install locked dependencies
        run: bun ci

      - name: Install locked Studio dependencies
        run: bun install --cwd studio --frozen-lockfile

      - name: Check formatting and lint
        run: bun run lint

      - name: Check types
        run: bun run type-check

      - name: Run tests
        run: bun run test

      - name: Apply database migrations
        run: bun run db:migrate

      - name: Run database integration test
        run: bun run test:integration

      - name: Install Chromium for browser tests
        run: bunx playwright install --with-deps chromium

      - name: Build and browser-test production application
        run: bun run test:e2e
        env:
          NODE_ENV: production

      - name: Build production Studio
        run: bun run --cwd studio build

      - name: Audit Studio high-severity vulnerabilities
        run: bun run --cwd studio audit

      - name: Audit high-severity vulnerabilities
        run: bun audit --audit-level high
